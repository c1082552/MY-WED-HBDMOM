<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HBD MOM 💗 — Birthday Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Mali:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-black: #000000;
      --pink-bright: #ff6ea8;
      --pink-soft: #ffb3d1;
      --pink-pale: #ffe3ef;
      --pink-glow: rgba(255, 110, 168, 0.75);
      --gold-warm: #ffd88a;
      --text-white: #fff8fb;
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-script: 'Dancing Script', 'Brush Script MT', cursive;
      --font-body: 'Quicksand', 'Mali', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow-x: hidden;
      overflow-y: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Screen Layers */
    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-black);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* =========================================
       1. FIRST PAGE: PURE BLACK + "CLICK"
       ========================================= */
    #screen-intro {
      z-index: 30;
      background-color: #000000;
    }

    .click-btn {
      position: relative;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 1.5rem 3rem;
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      font-weight: 500;
      letter-spacing: 0.42em;
      padding-left: calc(3rem + 0.42em);
      color: #fff5f9;
      text-transform: uppercase;
      outline: none;
      animation: clickGlowBlink 2.6s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease;
    }

    .click-btn::after {
      content: '';
      position: absolute;
      inset: 0.4rem 1.2rem;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 133, 182, 0.14) 0%, rgba(255, 133, 182, 0) 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .click-btn:hover,
    .click-btn:focus-visible {
      transform: scale(1.07);
      color: #ffffff;
    }

    .click-btn:hover::after,
    .click-btn:focus-visible::after {
      opacity: 1;
    }

    .click-btn:active {
      transform: scale(0.97);
    }

    @keyframes clickGlowBlink {
      0%, 100% {
        opacity: 0.38;
        text-shadow:
          0 0 8px rgba(255, 182, 213, 0.35),
          0 0 22px rgba(255, 110, 168, 0.2);
      }
      50% {
        opacity: 1;
        text-shadow:
          0 0 12px rgba(255, 255, 255, 0.85),
          0 0 28px rgba(255, 140, 188, 0.78),
          0 0 56px rgba(255, 105, 168, 0.48);
      }
    }

    /* =========================================
       2. COUNTDOWN SCREEN (10 -> 0)
       ========================================= */
    #screen-countdown {
      z-index: 25;
      background-color: #000000;
    }

    .countdown-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(320px, 80vw);
      height: min(320px, 80vw);
    }

    .countdown-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 145, 192, 0.28);
      box-shadow: 0 0 36px rgba(255, 110, 168, 0.16), inset 0 0 28px rgba(255, 110, 168, 0.1);
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
    }

    .countdown-ring.pulse {
      animation: ringPulse 0.96s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes ringPulse {
      0% {
        opacity: 0;
        transform: scale(0.68);
      }
      30% {
        opacity: 0.75;
      }
      100% {
        opacity: 0;
        transform: scale(1.26);
      }
    }

    .countdown-number {
      font-family: var(--font-display);
      font-size: clamp(6.5rem, 23vw, 13.5rem);
      font-weight: 700;
      line-height: 1;
      color: #fff3f8;
      text-shadow:
        0 0 18px rgba(255, 255, 255, 0.75),
        0 0 42px rgba(255, 122, 178, 0.75),
        0 0 85px rgba(255, 92, 160, 0.42);
      opacity: 0;
      will-change: transform, opacity;
    }

    .countdown-number.animate {
      animation: countdownZoomFade 0.96s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes countdownZoomFade {
      0% {
        opacity: 0;
        transform: scale(0.45);
        filter: blur(6px);
      }
      24% {
        opacity: 1;
        transform: scale(1.06);
        filter: blur(0px);
      }
      58% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: scale(1.32);
        filter: blur(5px);
      }
    }

    /* =========================================
       3. BIRTHDAY SURPRISE SCENE
       ========================================= */
    #screen-celebration {
      z-index: 20;
      background-color: #000000;
      overflow-y: auto;
      overflow-x: hidden;
      justify-content: center;
      padding: clamp(3.6rem, 7vh, 4.5rem) 1rem 1.5rem;
    }

    /* Soft romantic radial aura behind the cake (keeps pure black theme) */
    .ambient-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 105, 168, 0.14) 0%, rgba(181, 100, 220, 0.06) 28%, rgba(0, 0, 0, 0) 62%);
      pointer-events: none;
      z-index: 0;
    }

    /* Fullscreen Canvases for Balloons & Confetti */
    #balloon-canvas,
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #balloon-canvas {
      z-index: 1;
    }

    #confetti-canvas {
      z-index: 4;
    }

    /* Top Control Buttons (Music & Replay) */
    .controls-bar {
      position: fixed;
      top: max(0.85rem, env(safe-area-inset-top));
      right: max(0.85rem, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 0.55rem;
      z-index: 15;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      padding: 0.5rem 0.92rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 158, 199, 0.36);
      background: rgba(14, 6, 12, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffe6f1;
      font-family: var(--font-body);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55), 0 0 14px rgba(255, 110, 168, 0.16);
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .ctrl-btn:hover,
    .ctrl-btn:focus-visible {
      transform: translateY(-1px) scale(1.03);
      border-color: rgba(255, 158, 199, 0.78);
      background: rgba(34, 12, 26, 0.85);
      box-shadow: 0 6px 22px rgba(255, 110, 168, 0.28);
      outline: none;
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    .ctrl-btn.music-off {
      border-color: rgba(255, 255, 255, 0.2);
      color: rgba(255, 230, 241, 0.68);
    }

    .ctrl-icon {
      font-size: 0.95rem;
      line-height: 1;
    }

    /* Main Centered Celebration Content */
    .celebration-content {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(0.45rem, 1.5vh, 1rem);
      margin: auto 0;
    }

    /* Birthday Heading */
    .wishes-header {
      animation: gentleFloat 4.2s ease-in-out infinite;
    }

    .hbd-title {
      font-family: var(--font-display);
      font-size: clamp(2.35rem, 7.6vw, 4.65rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.12;
      background: linear-gradient(180deg, #fff5fa 0%, #ffb7d5 46%, #ff6da8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 0 10px rgba(255, 138, 187, 0.85))
        drop-shadow(0 0 28px rgba(255, 86, 156, 0.65));
      opacity: 0;
      transform: translateY(-16px) scale(0.92);
    }

    .celebration-revealed .hbd-title {
      animation: titleReveal 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    @keyframes titleReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Pink Three-Tier Cake Stage */
    .cake-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0.25rem;
      will-change: transform, opacity;
      opacity: 0;
      transform: scale(0.2);
    }

    .celebration-revealed .cake-stage {
      animation: cakeZoomBounce 1.15s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    .cake-stage.cake-pop {
      animation: cakeTapBounce 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 1;
      transform: scale(1);
    }

    @keyframes cakeZoomBounce {
      0% {
        opacity: 0;
        transform: scale(0.18) translateY(34px);
      }
      52% {
        opacity: 1;
        transform: scale(1.08) translateY(-8px);
      }
      72% {
        opacity: 1;
        transform: scale(0.95) translateY(3px);
      }
      88% {
        opacity: 1;
        transform: scale(1.025) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes cakeTapBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.06) translateY(-5px); }
      68% { transform: scale(0.97) translateY(2px); }
      100% { transform: scale(1); }
    }

    .cake-svg {
      width: clamp(210px, 56vw, 315px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 18px 34px rgba(255, 96, 162, 0.28));
    }

    /* Candle Flame Flicker Animations */
    .flame-group {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: flameFlicker 1.15s ease-in-out infinite alternate;
    }

    .flame-group.f2 { animation-duration: 0.95s; animation-delay: -0.25s; }
    .flame-group.f3 { animation-duration: 1.25s; animation-delay: -0.55s; }
    .flame-group.f4 { animation-duration: 1.02s; animation-delay: -0.15s; }
    .flame-group.f5 { animation-duration: 1.18s; animation-delay: -0.4s; }

    @keyframes flameFlicker {
      0% {
        transform: scale(1, 1) rotate(-2.5deg);
      }
      35% {
        transform: scale(0.94, 1.08) rotate(2deg);
      }
      70% {
        transform: scale(1.05, 0.96) rotate(-1.8deg);
      }
      100% {
        transform: scale(0.98, 1.11) rotate(2.8deg);
      }
    }

    .flame-halo {
      transform-box: fill-box;
      transform-origin: center;
      animation: haloPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes haloPulse {
      0% { opacity: 0.52; transform: scale(0.92); }
      100% { opacity: 0.92; transform: scale(1.14); }
    }

    /* Wishes Message Card */
    .wishes-message {
      max-width: 600px;
      padding: clamp(0.85rem, 2.4vw, 1.25rem) clamp(1.1rem, 3.6vw, 1.85rem);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(25, 8, 19, 0.68) 0%, rgba(10, 4, 9, 0.78) 100%);
      border: 1px solid rgba(255, 168, 206, 0.28);
      box-shadow:
        0 10px 36px rgba(0, 0, 0, 0.6),
        0 0 26px rgba(255, 110, 168, 0.16),
        inset 0 1px 0 rgba(255, 220, 236, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: gentleFloat 4.8s ease-in-out 0.6s infinite;
      opacity: 0;
      transform: translateY(18px);
    }

    .celebration-revealed .wishes-message {
      animation:
        messageReveal 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards,
        gentleFloat 4.8s ease-in-out 1.5s infinite;
    }

    @keyframes messageReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wish-lead {
      font-family: var(--font-script);
      font-size: clamp(1.45rem, 4.5vw, 2.15rem);
      font-weight: 700;
      color: #ffc2dc;
      line-height: 1.28;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 14px rgba(255, 128, 181, 0.55);
    }

    .wish-body {
      font-family: var(--font-body);
      font-size: clamp(0.92rem, 2.5vw, 1.08rem);
      font-weight: 500;
      line-height: 1.65;
      color: #fff0f6;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.75);
    }

    .cake-hint {
      margin-top: 0.15rem;
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      color: rgba(255, 198, 223, 0.62);
      opacity: 0;
    }

    .celebration-revealed .cake-hint {
      animation: fadeHint 1s ease 1.5s forwards;
    }

    @keyframes fadeHint {
      to { opacity: 1; }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    /* Mobile height tuning */
    @media (max-height: 700px) {
      #screen-celebration {
        padding-top: 3.4rem;
        padding-bottom: 1rem;
      }
      .cake-svg {
        width: clamp(175px, 42vw, 240px);
      }
      .hbd-title {
        font-size: clamp(2rem, 6.2vw, 3.4rem);
      }
      .wishes-message {
        padding: 0.75rem 1.1rem;
      }
      .wish-lead {
        font-size: clamp(1.3rem, 3.8vw, 1.75rem);
        margin-bottom: 0.3rem;
      }
      .wish-body {
        font-size: 0.88rem;
        line-height: 1.5;
      }
    }

    @media (max-width: 480px) {
      .controls-bar {
        top: 0.65rem;
        right: 0.65rem;
        gap: 0.4rem;
      }
      .ctrl-btn {
        padding: 0.44rem 0.76rem;
        font-size: 0.78rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .click-btn,
      .wishes-header,
      .wishes-message,
      .flame-group,
      .flame-halo {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. FIRST PAGE: PURE BLACK SCREEN WITH "CLICK" -->
  <main id="screen-intro" class="screen active" aria-label="Birthday Surprise Start Screen">
    <button id="start-btn" class="click-btn" type="button" aria-label="Click to start birthday surprise">
      CLICK
    </button>
  </main>

  <!-- 2. COUNTDOWN SCREEN (10 TO 0) -->
  <section id="screen-countdown" class="screen" aria-label="Birthday Countdown" aria-live="polite">
    <div class="countdown-stage">
      <div id="countdown-ring" class="countdown-ring" aria-hidden="true"></div>
      <div id="countdown-number" class="countdown-number">10</div>
    </div>
  </section>

  <!-- 3. BIRTHDAY SURPRISE SCENE -->
  <section id="screen-celebration" class="screen" aria-label="Happy Birthday Mom Celebration">
    <div class="ambient-glow" aria-hidden="true"></div>
    <canvas id="balloon-canvas" aria-hidden="true"></canvas>

    <!-- Controls: Music ON/OFF & Replay -->
    <div class="controls-bar">
      <button id="music-btn" class="ctrl-btn" type="button" aria-pressed="true" aria-label="Toggle birthday music">
        <span class="ctrl-icon" id="music-icon" aria-hidden="true">🎵</span>
        <span id="music-label">Music: ON</span>
      </button>
      <button id="replay-btn" class="ctrl-btn" type="button" aria-label="Replay birthday surprise from the beginning">
        <span class="ctrl-icon" aria-hidden="true">↺</span>
        <span>Replay</span>
      </button>
    </div>

    <div id="celebration-content" class="celebration-content">
      <!-- Main Glowing Heading -->
      <header class="wishes-header">
        <h1 class="hbd-title">HBD MOM 💗</h1>
      </header>

      <!-- Pink Three-Tier Birthday Cake -->
      <div id="cake-stage" class="cake-stage" role="button" tabindex="0" aria-label="Birthday cake — tap for extra sparkles and confetti">
        <svg class="cake-svg" viewBox="0 0 360 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink three-tier birthday cake with frosting, sprinkles, cream pearls, and five lit candles">
          <defs>
            <!-- Soft Cake Glow -->
            <radialGradient id="plateGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff7eb6" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#ff7eb6" stop-opacity="0" />
            </radialGradient>

            <!-- Tier Gradients -->
            <linearGradient id="tierBottom" x1="55" y1="220" x2="305" y2="295" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ff9ec7" />
              <stop offset="50%" stop-color="#ff7eb4" />
              <stop offset="100%" stop-color="#f25e9d" />
            </linearGradient>

            <linearGradient id="tierMiddle" x1="88" y1="158" x2="272" y2="225" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffb5d4" />
              <stop offset="55%" stop-color="#ff90bf" />
              <stop offset="100%" stop-color="#f56da7" />
            </linearGradient>

            <linearGradient id="tierTop" x1="120" y1="104" x2="240" y2="162" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffcce2" />
              <stop offset="55%" stop-color="#ffa6cb" />
              <stop offset="100%" stop-color="#fa7fb3" />
            </linearGradient>

            <!-- Frosting & Cream -->
            <linearGradient id="creamWhite" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="65%" stop-color="#fff0f7" />
              <stop offset="100%" stop-color="#ffd9ea" />
            </linearGradient>

            <linearGradient id="frostingPink" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffe5f1" />
              <stop offset="100%" stop-color="#ffb5d5" />
            </linearGradient>

            <!-- Stand Gradient -->
            <linearGradient id="cakeStand" x1="40" y1="296" x2="320" y2="336" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffe9f3" />
              <stop offset="45%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#f2c4d9" />
            </linearGradient>

            <!-- Candle Gradients -->
            <linearGradient id="candlePink" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ff8ec0" />
              <stop offset="50%" stop-color="#ffd4e8" />
              <stop offset="100%" stop-color="#ff6da9" />
            </linearGradient>

            <linearGradient id="candleGold" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ffd166" />
              <stop offset="50%" stop-color="#fff3c4" />
              <stop offset="100%" stop-color="#f4a836" />
            </linearGradient>

            <!-- Flame Gradients -->
            <radialGradient id="flameHaloGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffdf7d" stop-opacity="0.72" />
              <stop offset="55%" stop-color="#ff88b8" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#ff88b8" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff8c8" />
              <stop offset="45%" stop-color="#ffc247" />
              <stop offset="100%" stop-color="#ff6b35" />
            </linearGradient>
          </defs>

          <!-- Ambient Shadow Glow Under Stand -->
          <ellipse cx="180" cy="316" rx="142" ry="22" fill="url(#plateGlow)" />

          <!-- Cake Stand -->
          <path d="M150 304 L210 304 L222 328 C222 332 204 335 180 335 C156 335 138 332 138 328 Z" fill="url(#cakeStand)" opacity="0.92" />
          <ellipse cx="180" cy="300" rx="134" ry="15" fill="url(#cakeStand)" />
          <ellipse cx="180" cy="297" rx="126" ry="11" fill="#fff7fb" />

          <!-- ==================== BOTTOM TIER ==================== -->
          <g id="tier-1">
            <!-- Cake body -->
            <path d="M66 226 L294 226 L294 289 C294 298 243 305 180 305 C117 305 66 298 66 289 Z" fill="url(#tierBottom)" />
            <!-- Soft vertical highlight -->
            <rect x="82" y="232" width="18" height="58" rx="9" fill="#ffffff" opacity="0.16" />
            <!-- Top surface -->
            <ellipse cx="180" cy="226" rx="114" ry="13" fill="#ffb8d6" />
            <!-- White Frosting Drips -->

  <script>
    (function () {
      'use strict';

      /* =========================================
         DOM ELEMENTS
         ========================================= */
      const screenIntro = document.getElementById('screen-intro');
      const screenCountdown = document.getElementById('screen-countdown');
      const screenCelebration = document.getElementById('screen-celebration');

      const startBtn = document.getElementById('start-btn');
      const countdownNumberEl = document.getElementById('countdown-number');
      const countdownRingEl = document.getElementById('countdown-ring');

      const celebrationContent = document.getElementById('celebration-content');
      const cakeStage = document.getElementById('cake-stage');
      const musicBtn = document.getElementById('music-btn');
      const musicIcon = document.getElementById('music-icon');
      const musicLabel = document.getElementById('music-label');
      const replayBtn = document.getElementById('replay-btn');

      const balloonCanvas = document.getElementById('balloon-canvas');
      const confettiCanvas = document.getElementById('confetti-canvas');
      const bCtx = balloonCanvas.getContext('2d');
      const cCtx = confettiCanvas.getContext('2d');

      /* =========================================
         APP STATE
         ========================================= */
      const state = {
        phase: 'intro', // 'intro' | 'countdown' | 'celebration'
        countdownTimer: null,
        revealTimer: null,
        rafId: null,
        lastFrameTime: 0,
        musicEnabled: true,
        musicPlaying: false,
        width: window.innerWidth,
        height: window.innerHeight,
        dpr: Math.min(window.devicePixelRatio || 1, 2)
      };

      /* =========================================
         WEB AUDIO API — MUSIC BOX "HAPPY BIRTHDAY"
         ========================================= */
      const AudioEngine = {
        ctx: null,
        masterGain: null,
        loopTimer: null,
        activeNodes: [],

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.24;
            this.masterGain.connect(this.ctx.destination);
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        },

        playTick(isFinal) {
          if (!state.musicEnabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isFinal ? 880 : 523.25, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(isFinal ? 0.16 : 0.07, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (isFinal ? 0.5 : 0.2));
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + (isFinal ? 0.55 : 0.22));
        },

        playSparkleChime() {
          if (!state.musicEnabled || !this.ctx) return;
          const notes = [698.46, 880.0, 1046.5, 1396.91];
          const now = this.ctx.currentTime;
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.055);
            gain.gain.setValueAtTime(0.0001, now + i * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.11, now + i * 0.055 + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.055 + 0.45);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now + i * 0.055);
            osc.stop(now + i * 0.055 + 0.48);
          });
        },

        scheduleTone(freq, startTime, duration, volume, type) {
          if (!this.ctx || !this.masterGain) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(volume, startTime + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.04);

          this.activeNodes.push(osc);
          osc.onended = () => {
            const idx = this.activeNodes.indexOf(osc);
            if (idx > -1) this.activeNodes.splice(idx, 1);
          };
        },

        startBirthdaySong() {
          this.init();
          if (!this.ctx || !state.musicEnabled) return;
          this.stopBirthdaySong();
          state.musicPlaying = true;
          this.playSongLoop();
        },

        playSongLoop() {
          if (!state.musicPlaying || !state.musicEnabled || !this.ctx) return;

          const beat = 0.44;
          const now = this.ctx.currentTime + 0.08;

          // "Happy Birthday to You" in warm F Major
          const melody = [
            // Happy birthday to you
            { f: 523.25, b: 0.0, d: 0.72 },
            { f: 523.25, b: 0.75, d: 0.25 },
            { f: 587.33, b: 1.0, d: 0.95, chord: [174.61, 220.0, 261.63] },
            { f: 523.25, b: 2.0, d: 0.95 },
            { f: 698.46, b: 3.0, d: 0.95 },
            { f: 659.25, b: 4.0, d: 1.85, chord: [130.81, 164.81, 233.08] },

            // Happy birthday to you
            { f: 523.25, b: 6.0, d: 0.72 },
            { f: 523.25, b: 6.75, d: 0.25 },
            { f: 587.33, b: 7.0, d: 0.95, chord: [130.81, 164.81, 233.08] },
            { f: 523.25, b: 8.0, d: 0.95 },
            { f: 783.99, b: 9.0, d: 0.95 },
            { f: 698.46, b: 10.0, d: 1.85, chord: [174.61, 220.0, 261.63] },

            // Happy birthday dear Mom
            { f: 523.25, b: 12.0, d: 0.72 },
            { f: 523.25, b: 12.75, d: 0.25 },
            { f: 1046.5, b: 13.0, d: 0.95, chord: [174.61, 220.0, 261.63] },
            { f: 880.0, b: 14.0, d: 0.95 },
            { f: 698.46, b: 15.0, d: 0.95, chord: [233.08, 293.66, 349.23] },
            { f: 659.25, b: 16.0, d: 0.95 },
            { f: 587.33, b: 17.0, d: 1.45 },

            // Happy birthday to you
            { f: 932.33, b: 18.75, d: 0.72 },
            { f: 932.33, b: 19.5, d: 0.25 },
            { f: 880.0, b: 19.75, d: 0.95, chord: [174.61, 220.0, 261.63] },
            { f: 698.46, b: 20.75, d: 0.95, chord: [130.81, 164.81, 233.08] },
            { f: 783.99, b: 21.75, d: 0.95 },
            { f: 698.46, b: 22.75, d: 2.4, chord: [174.61, 220.0, 261.63] }
          ];

          melody.forEach((n) => {
            const t = now + n.b * beat;
            const dur = Math.max(0.32, n.d * beat * 1.15);
            // Warm music-box fundamental + gentle bell overtone
            this.scheduleTone(n.f, t, dur, 0.24, 'sine');
            this.scheduleTone(n.f * 2, t, dur * 0.55, 0.045, 'triangle');

            if (n.chord) {
              n.chord.forEach((cf) => {
                this.scheduleTone(cf, t, beat * 2.6, 0.055, 'sine');
              });
            }
          });

          const totalMs = 26.2 * beat * 1000;
          this.loopTimer = window.setTimeout(() => {
            if (state.musicPlaying && state.musicEnabled && state.phase === 'celebration') {
              this.playSongLoop();
            }
          }, totalMs);
        },

        stopBirthdaySong() {
          state.musicPlaying = false;
          if (this.loopTimer) {
            clearTimeout(this.loopTimer);
            this.loopTimer = null;
          }
          this.activeNodes.forEach((node) => {
            try {
              node.stop();
            } catch (_) {
              // already stopped
            }
          });
          this.activeNodes = [];
        }
      };

      /* =========================================
         CANVAS EFFECTS: STARS, BALLOONS, CONFETTI
         ========================================= */
      const BALLOON_PALETTE = [
        { main: '#ff6ea8', light: '#ffc2dc', dark: '#d63b7a' }, // Pink
        { main: '#ff8cc6', light: '#ffd9ed', dark: '#db5298' }, // Rose Pink
        { main: '#a86bff', light: '#dfc7ff', dark: '#7238cc' }, // Purple
        { main: '#4ec3ff', light: '#bce9ff', dark: '#2188c9' }, // Blue
        { main: '#ffd15c', light: '#fff0bd', dark: '#d99a1e' }, // Yellow
        { main: '#ff5268', light: '#ffb8c1', dark: '#c9263c' }  // Red
      ];

      const CONFETTI_COLORS = [
        '#ff6ea8', '#ffb3d1', '#b57bff', '#58c4ff',
        '#ffd45e', '#ff546b', '#ffffff', '#ff94c2'
      ];

      let stars = [];
      let balloons = [];
      let confettiPieces = [];

      function resizeCanvases() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);

        [balloonCanvas, confettiCanvas].forEach((canvas) => {
          canvas.width = Math.floor(state.width * state.dpr);
          canvas.height = Math.floor(state.height * state.dpr);
          canvas.style.width = state.width + 'px';
          canvas.style.height = state.height + 'px';
        });

        bCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        cCtx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      function createStar() {
        return {
          x: Math.random() * state.width,
          y: Math.random() * state.height,
          r: 0.6 + Math.random() * 1.6,
          alpha: Math.random(),
          speed: 0.6 + Math.random() * 1.6,
          phase: Math.random() * Math.PI * 2,
          tint: Math.random() > 0.35 ? '#ffd6e9' : '#ffffff'
        };
      }

      function createBalloon(initialSpread) {
        const palette = BALLOON_PALETTE[Math.floor(Math.random() * BALLOON_PALETTE.length)];
        const scaleFactor = state.width < 600 ? 0.78 : 1;
        const rx = (22 + Math.random() * 20) * scaleFactor;
        const ry = rx * (1.18 + Math.random() * 0.08);
        const startY = initialSpread
          ? state.height + ry + Math.random() * (state.height * 0.95)
          : state.height + ry + 30 + Math.random() * 180;

        return {
          x: rx + Math.random() * Math.max(40, state.width - rx * 2),
          y: startY,
          rx,
          ry,
          color: palette,
          speedY: 36 + Math.random() * 44,
          swayAmp: 14 + Math.random() * 24,
          swayFreq: 0.45 + Math.random() * 0.65,
          phase: Math.random() * Math.PI * 2,
          stringLen: (58 + Math.random() * 46) * scaleFactor,
          opacity: 0.86 + Math.random() * 0.14
        };
      }

      function createConfettiPiece(fromTop, burstOrigin) {
        const shapes = ['rect', 'circle', 'ribbon', 'heart'];
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];

        if (burstOrigin) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 110 + Math.random() * 260;
          return {
            x: burstOrigin.x,
            y: burstOrigin.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 130,
            gravity: 340,
            size: 5 + Math.random() * 6.5,
            color,
            shape,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 9,
            tiltPhase: Math.random() * Math.PI * 2,
            tiltSpeed: 4 + Math.random() * 5,
            life: 1,
            isBurst: true
          };
        }

        return {
          x: Math.random() * state.width,
          y: fromTop ? -15 - Math.random() * 120 : -Math.random() * state.height,
          vx: (Math.random() - 0.5) * 42,
          vy: 68 + Math.random() * 98,
          gravity: 0,
          size: 5 + Math.random() * 7,
          color,
          shape,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 5.2,
          tiltPhase: Math.random() * Math.PI * 2,
          tiltSpeed: 2.5 + Math.random() * 4,
          swayPhase: Math.random() * Math.PI * 2,
          swayAmp: 18 + Math.random() * 28,
          life: 1,
          isBurst: false
        };
      }

      function spawnCelebrationParticles() {
        const isMobile = state.width < 640;
        const starCount = isMobile ? 42 : 75;
        const balloonCount = isMobile ? 20 : 34;
        const confettiCount = isMobile ? 65 : 115;

        stars = Array.from({ length: starCount }, createStar);
        balloons = Array.from({ length: balloonCount }, () => createBalloon(true));
        confettiPieces = Array.from({ length: confettiCount }, () => createConfettiPiece(false, null));

        // Initial joyous burst from center-top
        triggerConfettiBurst(state.width * 0.5, state.height * 0.42, isMobile ? 38 : 64);
      }

      function triggerConfettiBurst(x, y, count) {
        for (let i = 0; i < count; i++) {
          confettiPieces.push(createConfettiPiece(false, { x, y }));
        }
      }

      function drawBalloon(ctx, b, timeSec) {
        const swayOffset = Math.sin(timeSec * b.swayFreq + b.phase) * b.swayAmp;
        const cx = b.x + swayOffset;
        const cy = b.y;
        const tilt = Math.cos(timeSec * b.swayFreq + b.phase) * 0.08;

        ctx.save();
        ctx.globalAlpha = b.opacity;
        ctx.translate(cx, cy);
        ctx.rotate(tilt);

        // Realistic waving balloon string
        const wave1 = Math.sin(timeSec * 2.4 + b.phase) * 8;
        const wave2 = Math.cos(timeSec * 1.9 + b.phase) * 10;
        ctx.beginPath();
        ctx.moveTo(0, b.ry + 5);
        ctx.bezierCurveTo(
          wave1, b.ry + b.stringLen * 0.36,
          wave2, b.ry + b.stringLen * 0.72,
          wave1 * 0.6, b.ry + b.stringLen
        );
        ctx.strokeStyle = 'rgba(255, 224, 240, 0.45)';
        ctx.lineWidth = 1.25;
        ctx.stroke();

        // Balloon knot at base
        ctx.beginPath();
        ctx.moveTo(-4, b.ry + 5);
        ctx.lineTo(4, b.ry + 5);
        ctx.lineTo(0, b.ry - 1);
        ctx.closePath();
        ctx.fillStyle = b.color.dark;
        ctx.fill();

        // Balloon body with 3D radial shading
        const grad = ctx.createRadialGradient(
          -b.rx * 0.32, -b.ry * 0.34, b.rx * 0.1,
          0, 0, b.ry * 1.15
        );
        grad.addColorStop(0, b.color.light);
        grad.addColorStop(0.45, b.color.main);
        grad.addColorStop(1, b.color.dark);

        ctx.beginPath();
        ctx.ellipse(0, 0, b.rx, b.ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        // Glossy curved specular highlight
        ctx.beginPath();
        ctx.ellipse(-b.rx * 0.36, -b.ry * 0.32, b.rx * 0.19, b.ry * 0.32, -0.35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.38)';
        ctx.fill();

        ctx.restore();
      }

      function drawConfettiPiece(ctx, p) {
        const scaleY = Math.cos(p.tiltPhase);
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.abs(scaleY) < 0.2 ? 0.2 : scaleY);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.size * 0.5, -p.size * 0.32, p.size, p.size * 0.64);
        } else if (p.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.shape === 'ribbon') {
          ctx.fillRect(-p.size * 0.72, -p.size * 0.18, p.size * 1.44, p.size * 0.36);
        } else {
          // Mini heart
          const s = p.size * 0.45;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.6);
          ctx.bezierCurveTo(-s * 1.3, -s * 0.2, -s * 0.7, -s * 1.2, 0, -s * 0.35);
          ctx.bezierCurveTo(s * 0.7, -s * 1.2, s * 1.3, -s * 0.2, 0, s * 0.6);
          ctx.fill();
        }

        ctx.restore();
      }

      function animateCelebration(timestamp) {
        if (state.phase !== 'celebration') return;

        if (!state.lastFrameTime) state.lastFrameTime = timestamp;
        const dt = Math.min((timestamp - state.lastFrameTime) / 1000, 0.05);
        state.lastFrameTime = timestamp;
        const timeSec = timestamp / 1000;

        // Clear both canvases
        bCtx.clearRect(0, 0, state.width, state.height);
        cCtx.clearRect(0, 0, state.width, state.height);

        // 1. Twinkling Stars on background canvas
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = 0.2 + 0.75 * (0.5 + 0.5 * Math.sin(timeSec * s.speed + s.phase));
          bCtx.fillStyle = s.tint;
          bCtx.globalAlpha = twinkle;
          bCtx.beginPath();
          bCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          bCtx.fill();
        }
        bCtx.globalAlpha = 1;

        // 2. Floating Balloons on background canvas
        for (let i = 0; i < balloons.length; i++) {
          const b = balloons[i];
          b.y -= b.speedY * dt;
          if (b.y < -(b.ry + b.stringLen + 40)) {
            balloons[i] = createBalloon(false);
          }
          drawBalloon(bCtx, balloons[i], timeSec);
        }

        // 3. Falling & Bursting Confetti on foreground canvas
        for (let i = confettiPieces.length - 1; i >= 0; i--) {
          const p = confettiPieces[i];
          p.rot += p.rotSpeed * dt;
          p.tiltPhase += p.tiltSpeed * dt;

          if (p.isBurst) {
            p.vy += p.gravity * dt;
            p.vx *= 0.985;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 0.42;
            if (p.life <= 0 || p.y > state.height + 40) {
              confettiPieces.splice(i, 1);
              continue;
            }
          } else {
            p.y += p.vy * dt;
            p.x += (p.vx + Math.sin(timeSec * 1.8 + p.swayPhase) * p.swayAmp) * dt;
            if (p.y > state.height + 24) {
              confettiPieces[i] = createConfettiPiece(true, null);
            } else if (p.x < -30) {
              p.x = state.width + 20;
            } else if (p.x > state.width + 30) {
              p.x = -20;
            }
          }

          drawConfettiPiece(cCtx, p);
        }

        state.rafId = window.requestAnimationFrame(animateCelebration);
      }

      function stopCanvasAnimation() {
        if (state.rafId) {
          window.cancelAnimationFrame(state.rafId);
          state.rafId = null;
        }
        state.lastFrameTime = 0;
        bCtx.clearRect(0, 0, state.width, state.height);
        cCtx.clearRect(0, 0, state.width, state.height);
        stars = [];
        balloons = [];
        confettiPieces = [];
      }

      /* =========================================
         SCREEN TRANSITIONS & COUNTDOWN FLOW
         ========================================= */
      function setActiveScreen(phase) {
        state.phase = phase;
        screenIntro.classList.toggle('active', phase === 'intro');
        screenCountdown.classList.toggle('active', phase === 'countdown');
        screenCelebration.classList.toggle('active', phase === 'celebration');
      }

      function clearAllTimers() {
        if (state.countdownTimer) {
          clearTimeout(state.countdownTimer);
          state.countdownTimer = null;
        }
        if (state.revealTimer) {
          clearTimeout(state.revealTimer);
          state.revealTimer = null;
        }
      }

      function showCountdownDigit(value) {
        countdownNumberEl.textContent = String(value);

        // Retrigger smooth Fade In + Zoom + Fade Out animation
        countdownNumberEl.classList.remove('animate');
        countdownRingEl.classList.remove('pulse');
        void countdownNumberEl.offsetWidth;
        countdownNumberEl.classList.add('animate');
        countdownRingEl.classList.add('pulse');

        AudioEngine.playTick(value === 0);
      }

      function startCountdownSequence() {
        clearAllTimers();
        AudioEngine.init();
        setActiveScreen('countdown');

        let current = 10;

        function step() {
          if (state.phase !== 'countdown') return;
          showCountdownDigit(current);

          if (current > 0) {
            current -= 1;
            state.countdownTimer = window.setTimeout(step, 1000);
          } else {
            // After 0 finishes its smooth zoom/fade, trigger birthday surprise
            state.revealTimer = window.setTimeout(() => {
              if (state.phase === 'countdown') {
                revealBirthdaySurprise();
              }
            }, 950);
          }
        }

        // Small pause so the transition from CLICK feels smooth and dramatic
        state.countdownTimer = window.setTimeout(step, 420);
      }

      function revealBirthdaySurprise() {
        clearAllTimers();
        resizeCanvases();
        setActiveScreen('celebration');

        // Reset and trigger entrance animations
        celebrationContent.classList.remove('celebration-revealed');
        void celebrationContent.offsetWidth;
        celebrationContent.classList.add('celebration-revealed');

        spawnCelebrationParticles();
        state.lastFrameTime = 0;
        state.rafId = window.requestAnimationFrame(animateCelebration);

        updateMusicButtonUI();
        if (state.musicEnabled) {
          AudioEngine.startBirthdaySong();
        }
      }

      function replaySurprise() {
        clearAllTimers();
        stopCanvasAnimation();
        AudioEngine.stopBirthdaySong();
        celebrationContent.classList.remove('celebration-revealed');
        countdownNumberEl.classList.remove('animate');
        countdownRingEl.classList.remove('pulse');
        countdownNumberEl.textContent = '10';
        setActiveScreen('intro');
      }

      function updateMusicButtonUI() {
        musicBtn.setAttribute('aria-pressed', String(state.musicEnabled));
        musicBtn.classList.toggle('music-off', !state.musicEnabled);
        musicIcon.textContent = state.musicEnabled ? '🎵' : '🔇';
        musicLabel.textContent = state.musicEnabled ? 'Music: ON' : 'Music: OFF';
      }

      function toggleMusic() {
        AudioEngine.init();
        state.musicEnabled = !state.musicEnabled;
        updateMusicButtonUI();

        if (state.musicEnabled && state.phase === 'celebration') {
          AudioEngine.startBirthdaySong();
        } else {
          AudioEngine.stopBirthdaySong();
        }
      }

      function celebrateCakeTap() {
        if (state.phase !== 'celebration') return;
        const rect = cakeStage.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height * 0.35;
        triggerConfettiBurst(cx, cy, 42);
        AudioEngine.playSparkleChime();

        cakeStage.classList.remove('cake-pop');
        void cakeStage.offsetWidth;
        cakeStage.classList.add('cake-pop');
      }

      /* =========================================
         EVENT LISTENERS
         ========================================= */
      startBtn.addEventListener('click', startCountdownSequence);
      musicBtn.addEventListener('click', toggleMusic);
      replayBtn.addEventListener('click', replaySurprise);

      cakeStage.addEventListener('click', celebrateCakeTap);
      cakeStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          celebrateCakeTap();
        }
      });

      window.addEventListener('resize', () => {
        resizeCanvases();
      });

      // Initialize canvas dimensions cleanly while keeping intro screen pure black
      resizeCanvases();
      updateMusicButtonUI();
    })();
  </script>
</body>
</html>
